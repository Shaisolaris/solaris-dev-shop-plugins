name: Native package conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: distribution
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Shaisolaris/solaris-dev-shop
          ref: 0391e15cc52ddfa88a6c02b5997fd9955e214491
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Shaisolaris/solaris-dev-shop
          ref: 129781961be54cc2f12d6bafe80e81d6a1cd8d02
          path: reviewed-packager
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 Pillow==11.3.0
      - name: Exact upstream bytes, native metadata and negative controls
        run: python distribution/tools/verify_distribution.py --source upstream --packager reviewed-packager --self-test
      - name: Native OpenCode entrypoint syntax
        run: |
          node --check distribution/plugin/server.mjs
          node --check distribution/plugin/native/opencode.mjs
      - name: Copilot contained resources and actual entrypoint outcomes
        run: python distribution/tools/verify_copilot_layout.py --self-test
      - name: Installed source router and real recovery controls
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/distribution/plugin/control-plane/meta_control_plane.py" self-test
          python "$GITHUB_WORKSPACE/distribution/plugin/examples/capabilities/G39/drill_oracle.py"
      - name: Exact native harness profiles, refusal controls and installed callers
        run: |
          git -C distribution fetch --no-tags --depth=1 origin 3e65eac657a155aab9d813a5093be6442ac57eef
          python -B distribution/tools/verify_harness_profiles.py --self-test
          node --check distribution/harnesses/deepseek/native/deepseek.mjs
          node --check distribution/harnesses/kilo/native/kilo.mjs
      - name: Composite distribution notices and real provenance cross-checks
        run: |
          python -B distribution/tools/verify_distribution_metadata.py --self-test
          python -B distribution/copilot/plugin/examples/capabilities/G38/authority_oracle.py
          python -B distribution/copilot/plugin/examples/capabilities/G42/cross_checks.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Actual native OpenClaw CLI registration and coordinator outcome
        env:
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/solaris-openclaw-state
          OPENCLAW_CONFIG_PATH: ${{ runner.temp }}/solaris-openclaw-state/openclaw.json
          DO_NOT_TRACK: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/solaris-host" --ignore-scripts --no-audit --no-fund openclaw@2026.10.5
          HOST="$RUNNER_TEMP/solaris-host/node_modules/openclaw/openclaw.mjs"
          node "$HOST" plugins install "$GITHUB_WORKSPACE/distribution/harnesses/openclaw" --force --accept-capabilities
          node "$HOST" plugins enable solaris-dev-shop
          node "$HOST" solaris intake 'review this code' --json > "$RUNNER_TEMP/solaris-intake.json"
          python -c 'import json,os;from pathlib import Path;r=json.loads((Path(os.environ["RUNNER_TEMP"])/"solaris-intake.json").read_text());assert r["assignment"]["primary_capability"] == "solaris.code-reviewer";assert r["performed_work"] is False'
          node "$HOST" skills list --json > "$RUNNER_TEMP/solaris-skills.json"
          python -c 'import json,os;from pathlib import Path;i=json.loads(Path("distribution/harnesses/openclaw/native/skills.json").read_text());n={s["name"] for s in i};r=json.loads((Path(os.environ["RUNNER_TEMP"])/"solaris-skills.json").read_text());a=[s for s in r["skills"] if s["name"] in n];assert len(a)==62 and all(s["modelVisible"] for s in a)'
      - name: Actual Antigravity native plugin manager in a fresh hosted profile
        run: python -B distribution/tools/verify_antigravity_host.py --work "$RUNNER_TEMP/solaris-antigravity-native"
      - name: Additional native Cline profile source and refusal controls
        run: python -B distribution/tools/verify_extra_harnesses.py --host cline --self-test
      - name: Native Amp source, local callers and refusal controls
        run: python -B distribution/tools/verify_extra_harnesses.py --host amp --self-test
      - name: Actual Amp plugin process and registered tool callback outcomes
        run: |
          npm install --prefix "$RUNNER_TEMP/solaris-amp-host" --ignore-scripts --no-audit --no-fund @ampcode/cli@0.0.1792680614-g8973a3
          python -B distribution/tools/verify_amp_host.py --cli "$RUNNER_TEMP/solaris-amp-host/node_modules/@ampcode/cli-linux-x64/amp" --candidate "$GITHUB_WORKSPACE/distribution/harnesses/amp" --work "$RUNNER_TEMP/solaris-amp-native"
      - name: Actual Cline installation, bundled skills and worker tool outcomes
        run: |
          npm install --prefix "$RUNNER_TEMP/solaris-cline-host" --ignore-scripts --no-audit --no-fund cline@3.0.73
          python -B distribution/tools/verify_cline_host.py --cli "$RUNNER_TEMP/solaris-cline-host/node_modules/.bin/cline" --modules "$RUNNER_TEMP/solaris-cline-host/node_modules" --candidate "$GITHUB_WORKSPACE/distribution/harnesses/cline" --work "$RUNNER_TEMP/solaris-cline-native"
      - name: Actual immutable public Cline Git installation and source binding
        run: |
          python -B distribution/tools/verify_cline_host.py --cli "$RUNNER_TEMP/solaris-cline-host/node_modules/.bin/cline" --modules "$RUNNER_TEMP/solaris-cline-host/node_modules" --candidate "$GITHUB_WORKSPACE/distribution/harnesses/cline" --git-source 'https://github.com/Shaisolaris/solaris-dev-shop-cline.git@0184a674c1e70d5b4bb2f22bb298e8f8cc005f3c' --work "$RUNNER_TEMP/solaris-cline-public"
