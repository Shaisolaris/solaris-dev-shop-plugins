name: Native package conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: distribution
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Shaisolaris/solaris-dev-shop
          ref: d6f7c37c6039320f2eb284363038edae0cf15e7b
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Exact upstream bytes, native metadata and negative controls
        run: python distribution/tools/verify_distribution.py --source upstream --self-test
      - name: Native OpenCode entrypoint syntax
        run: |
          node --check distribution/plugin/server.mjs
          node --check distribution/plugin/native/opencode.mjs
      - name: Installed source router and real recovery controls
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/distribution/plugin/control-plane/meta_control_plane.py" self-test
          python "$GITHUB_WORKSPACE/distribution/plugin/examples/capabilities/G39/drill_oracle.py"
